            <rect x="3" y="4" width="8" height="6" rx="1" fill="#fff"></rect>
            <rect x="13" y="4" width="8" height="6" rx="1" fill="#f97316"></rect>
            <rect x="3" y="14" width="8" height="6" rx="1" fill="#f97316"></rect>
            <rect x="13" y="14" width="8" height="6" rx="1" fill="#fff"></rect>
          </svg>
        </span>
      );
    }

    // =========================================================================
    // Homepage interactive dashboard demo (local-only — does not touch real data)
    // =========================================================================
    const DEMO_OWNER_NAME = 'Maya Chen';
    const DEMO_JOB_STATUSES = ['Pending', 'In Progress', 'Completed'];

    const demoStatusTone = (status) => {
      if (status === 'Completed') return 'bg-emerald-50 text-emerald-700';
      if (status === 'In Progress') return 'bg-ember-50 text-ember-700';
      if (status === 'Won' || status === 'Booked') return 'bg-emerald-50 text-emerald-700';
      if (status === 'Contacted') return 'bg-amber-50 text-amber-700';
      return 'bg-slate-100 text-slate-600';
    };

    const INITIAL_DEMO_DASHBOARD = {
      jobs: [
        { id: 'dj1', customer: 'John Smith', service: 'Drain Cleaning', status: 'Completed' },
        { id: 'dj2', customer: 'Sarah Wilson', service: 'Water Heater Repair', status: 'In Progress' },
        { id: 'dj3', customer: 'Mike Brown', service: 'Pipe Repair', status: 'Pending' },
      ],
      leads: [
        { id: 'dl1', name: 'Priya Patel', email: 'priya@example.com', phone: '(555) 204-1188', service: 'Boiler install', status: 'New' },
        { id: 'dl2', name: 'Chris Nguyen', email: 'chris@example.com', phone: '(555) 441-9020', service: 'Leak inspection', status: 'Contacted' },
        { id: 'dl3', name: 'Elena Rossi', email: 'elena@example.com', phone: '(555) 773-0142', service: 'Bathroom remodel', status: 'New' },
      ],
      customers: [
        { id: 'dc1', name: 'John Smith', jobs: 4, phone: '(555) 201-0091' },
        { id: 'dc2', name: 'Sarah Wilson', jobs: 2, phone: '(555) 882-4410' },
        { id: 'dc3', name: 'Mike Brown', jobs: 1, phone: '(555) 330-7755' },
      ],
      reviews: [
        { id: 'dr1', name: 'John Smith', stars: 5, text: 'Showed up fast and fixed the drain the same day.' },
        { id: 'dr2', name: 'Lena Ortiz', stars: 5, text: 'Clear pricing and a follow-up text after the job. Easy.' },
      ],
      automations: [
        { id: 'da1', name: 'Missed Call → SMS', active: true },
        { id: 'da2', name: 'Job Completed → Review Request', active: true },
        { id: 'da3', name: 'Delayed Follow-Up', active: false },
      ],
      settings: { company: 'Northside Plumbing', phone: '(555) 014-2208', city: 'Austin, TX' },
    };

    function HomeDemoDashboard({ variant = 'hero' }) {
      const [tab, setTab] = useState('overview');
      const [jobs, setJobs] = useState(INITIAL_DEMO_DASHBOARD.jobs);
      const [leads, setLeads] = useState(INITIAL_DEMO_DASHBOARD.leads);
      const [customers, setCustomers] = useState(INITIAL_DEMO_DASHBOARD.customers);
      const [reviews, setReviews] = useState(INITIAL_DEMO_DASHBOARD.reviews);
      const [automations, setAutomations] = useState(INITIAL_DEMO_DASHBOARD.automations);
      const [settings, setSettings] = useState(INITIAL_DEMO_DASHBOARD.settings);
      const [notice, setNotice] = useState('Click around — this is a live demo, not the real portal.');
      const [showNewJob, setShowNewJob] = useState(false);
      const [newJob, setNewJob] = useState({ customer: '', service: '' });

      const nav = [
        { id: 'overview', label: 'Overview', icon: 'layout-dashboard' },
        { id: 'jobs', label: 'Jobs', icon: 'hammer' },
        { id: 'leads', label: 'Leads', icon: 'user-plus' },
        { id: 'customers', label: 'Customers', icon: 'users' },
        { id: 'reviews', label: 'Reviews', icon: 'message-square-quote' },
        { id: 'automations', label: 'Automations', icon: 'repeat' },
        { id: 'settings', label: 'Settings', icon: 'settings' },
      ];

      const ping = (msg) => setNotice(msg);
      const cycleJobStatus = (id) => {
        setJobs((prev) => prev.map((job) => {
          if (job.id !== id) return job;
          const next = DEMO_JOB_STATUSES[(DEMO_JOB_STATUSES.indexOf(job.status) + 1) % DEMO_JOB_STATUSES.length];
          ping(`${job.customer}: ${job.status} → ${next}`);
          return { ...job, status: next };
        }));
      };

      const addJob = (e) => {
        e.preventDefault();
        if (!newJob.customer.trim() || !newJob.service.trim()) return;
        setJobs((prev) => [{ id: `dj_${Date.now()}`, customer: newJob.customer.trim(), service: newJob.service.trim(), status: 'Pending' }, ...prev]);
        ping(`Job added for ${newJob.customer.trim()}`);
        setNewJob({ customer: '', service: '' });
        setShowNewJob(false);
        setTab('jobs');
      };

      const convertLead = (lead) => {
        setLeads((prev) => prev.map((item) => item.id === lead.id ? { ...item, status: 'Won' } : item));
        setJobs((prev) => [{ id: `dj_${Date.now()}`, customer: lead.name, service: lead.service, status: 'Pending' }, ...prev]);
        setCustomers((prev) => prev.some((c) => c.name === lead.name) ? prev : [{ id: `dc_${Date.now()}`, name: lead.name, jobs: 1, phone: lead.phone }, ...prev]);
        ping(`${lead.name} converted into a job`);
        setTab('jobs');
      };

      const requestReview = (job) => {
        if (job.status !== 'Completed') {
          ping('Mark the job completed first, then request a review.');
          return;
        }
        setReviews((prev) => [{ id: `dr_${Date.now()}`, name: job.customer, stars: 5, text: 'Review request sent. Waiting on the customer.' }, ...prev]);
        ping(`Review request sent to ${job.customer}`);
        setTab('reviews');
      };

      const stats = [
        { label: 'New Leads', value: leads.filter((l) => l.status === 'New').length, delta: `+${leads.length}`, icon: 'user-plus', tone: 'text-blue-600 bg-blue-50', tab: 'leads' },
        { label: 'Active Jobs', value: jobs.filter((j) => j.status !== 'Completed').length, delta: `+${jobs.length}`, icon: 'hammer', tone: 'text-ember-600 bg-ember-50', tab: 'jobs' },
        { label: 'Completed', value: jobs.filter((j) => j.status === 'Completed').length, delta: '+2', icon: 'circle-check', tone: 'text-emerald-600 bg-emerald-50', tab: 'jobs' },
        { label: 'Review Requests', value: reviews.length, delta: `+${reviews.length}`, icon: 'message-square-quote', tone: 'text-violet-600 bg-slate-100', tab: 'reviews' },
      ];

      const isHero = variant === 'hero';

      const dashboardBody = (
        <div className="flex min-h-0 flex-1 overflow-hidden">
          <aside className={`hidden shrink-0 flex-col bg-slate-900 sm:flex ${isHero ? 'w-14 p-1.5' : 'w-[188px] p-3'}`}>
            {!isHero && <div className="px-2 pb-3 text-[10px] font-bold uppercase tracking-[0.18em] text-slate-400">Brik Systems</div>}
            <nav className="space-y-0.5">
              {nav.map((item) => (
                <button
                  key={item.id}
                  type="button"
                  title={item.label}
                  onClick={() => { setTab(item.id); ping(`Opened ${item.label}`); }}
                  className={`flex w-full items-center rounded-lg text-left transition ${isHero ? 'justify-center px-0 py-2.5' : 'gap-2.5 px-3 py-2 text-sm'} ${tab === item.id ? 'bg-ember-500 font-medium text-white' : 'text-slate-300 hover:bg-white/5 hover:text-white'}`}
                >
                  <Icon name={item.icon} className="h-4 w-4" />
                  {!isHero && item.label}

              ))}
            </nav>
          </aside>
          <div className="flex min-h-0 min-w-0 flex-1 flex-col">
            <div className={`flex items-center justify-between border-b border-slate-100 ${isHero ? 'px-3 py-2' : 'px-4 py-3 sm:px-5'}`}>
              <div className="min-w-0">
                <p className="text-[11px] font-medium text-slate-400">Good morning,</p>
                <p className={`truncate font-bold text-slate-900 ${isHero ? 'text-sm' : 'text-base sm:text-lg'}`}>{DEMO_OWNER_NAME}</p>
              </div>
              <span className="inline-flex shrink-0 items-center gap-1.5 rounded-full bg-emerald-50 px-2 py-0.5 text-[10px] font-semibold text-emerald-700">

                Live demo

            </div>
            <div className={`flex gap-1 overflow-x-auto border-b border-slate-100 px-2 py-1.5 ${isHero ? 'sm:hidden' : 'md:hidden'}`}>
              {nav.map((item) => (
                <button
                  key={item.id}
                  type="button"
                  onClick={() => setTab(item.id)}
                  className={`whitespace-nowrap rounded-full px-2.5 py-1 text-[10px] font-medium ${tab === item.id ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}`}
                >
                  {item.label}
                </button>
              ))}
            </div>
            {!isHero && notice && (
              <p className="border-b border-ember-100 bg-ember-50 px-4 py-2 text-[11px] font-medium text-ember-800">{notice}</p>
            )}
            <div className={`min-h-0 flex-1 overflow-y-auto ${isHero ? 'p-3' : 'p-4 sm:p-5'}`}>
              {tab === 'overview' && (
                <div>
                  <div className={`grid grid-cols-2 ${isHero ? 'gap-2' : 'gap-3'}`}>
                    {stats.map((card) => (
                      <button
                        key={card.label}
                        type="button"
                        onClick={() => { setTab(card.tab); ping(`Opened ${card.label}`); }}
                        className={`rounded-xl border border-slate-100 bg-white text-left shadow-sm transition hover:-translate-y-0.5 hover:border-slate-300 hover:shadow ${isHero ? 'p-2.5' : 'p-3.5'}`}
                      >
                        <div className="flex items-center justify-between">
                          <span className={`inline-flex items-center justify-center rounded-lg ${card.tone} ${isHero ? 'h-7 w-7' : 'h-8 w-8'}`}>
                            <Icon name={card.icon} className={isHero ? 'h-3.5 w-3.5' : 'h-4 w-4'} />
                          </span>
                          <span className="text-[10px] font-semibold text-emerald-600">{card.delta}</span>
                        </div>
                        <p className={`mt-2 font-bold text-slate-900 ${isHero ? 'text-xl leading-none' : 'text-2xl'}`}>{card.value}</p>
                        <p className="mt-1 text-[11px] text-slate-500">{card.label}</p>
                      </button>
                    ))}
                  </div>
                  <div className={`rounded-xl border border-slate-100 bg-slate-50/60 ${isHero ? 'mt-2.5 p-2.5' : 'mt-4 p-4'}`}>
                    <p className="mb-2 text-[10px] font-semibold uppercase tracking-wider text-slate-500">Workflow</p>
                    <div className="flex items-center justify-between gap-0.5">
                      {[
                        { label: isHero ? 'Lead' : 'New Lead', icon: 'user-plus', tab: 'leads' },
                        { label: isHero ? 'Job' : 'In Progress', icon: 'hammer', tab: 'jobs' },
                        { label: isHero ? 'Done' : 'Completed', icon: 'circle-check', tab: 'jobs' },
                        { label: isHero ? 'Ask' : 'Review Requested', icon: 'message-square-quote', tab: 'reviews' },
                        { label: isHero ? 'Review' : 'Review Received', icon: 'star', tab: 'reviews' },
                      ].map((step, idx, arr) => (
                        <div key={step.label} className="flex min-w-0 flex-1 items-center">
                          <button type="button" onClick={() => setTab(step.tab)} className="flex min-w-0 flex-1 flex-col items-center gap-1 text-center">
                            <span className={`inline-flex items-center justify-center rounded-full border border-slate-200 bg-white text-slate-700 shadow-sm transition hover:border-ember-300 hover:text-ember-600 ${isHero ? 'h-7 w-7' : 'h-9 w-9'}`}>
                              <Icon name={step.icon} className={isHero ? 'h-3.5 w-3.5' : 'h-4 w-4'} />
                            </span>
                            <span className="w-full truncate text-[9px] font-medium leading-tight text-slate-500">{step.label}</span>
                          </button>
                          {idx < arr.length - 1 && <Icon name="arrow-right" className="h-3 w-3 shrink-0 text-slate-300" />}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {tab === 'jobs' && (
                <div>
                  <div className="flex items-center justify-between">
                    <div>
                      <h3 className="text-lg font-bold text-slate-900">Jobs</h3>
                      <p className="text-sm text-slate-500">Click a status to move the job forward.</p>
                    </div>
                    <button type="button" onClick={() => setShowNewJob((v) => !v)} className="rounded-lg bg-ember-500 px-3 py-1.5 text-sm font-medium text-white hover:bg-ember-600">
                      + New Job
                    </button>
                  </div>
                  {showNewJob && (
                    <form onSubmit={addJob} className="mt-3 grid gap-2 rounded-xl border border-slate-200 bg-slate-50 p-3 sm:grid-cols-[1fr_1fr_auto]">
                      <input value={newJob.customer} onChange={(e) => setNewJob({ ...newJob, customer: e.target.value })} placeholder="Customer name" className="h-9 rounded-md border border-slate-300 px-3 text-sm" />
                      <input value={newJob.service} onChange={(e) => setNewJob({ ...newJob, service: e.target.value })} placeholder="Service" className="h-9 rounded-md border border-slate-300 px-3 text-sm" />
                      <button type="submit" className="h-9 rounded-md bg-slate-900 px-4 text-sm font-medium text-white">Add</button>
                    </form>
                  )}
                  <div className="mt-4 overflow-hidden rounded-xl border border-slate-100">
                    <table className="w-full text-left text-sm">
                      <thead className="bg-slate-50 text-xs uppercase tracking-wider text-slate-500">
                        <tr>
                          <th className="px-4 py-3 font-medium">Customer</th>
                          <th className="px-4 py-3 font-medium">Service</th>
                          <th className="px-4 py-3 font-medium">Status</th>
                          <th className="px-4 py-3 font-medium"></th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {jobs.map((job) => (
                          <tr key={job.id} className="hover:bg-slate-50">
                            <td className="px-4 py-3 font-medium text-slate-900">{job.customer}</td>
                            <td className="px-4 py-3 text-slate-600">{job.service}</td>
                            <td className="px-4 py-3">
                              <button type="button" onClick={() => cycleJobStatus(job.id)} className={`rounded-full px-2.5 py-1 text-xs font-medium ${demoStatusTone(job.status)}`}>
                                {job.status}
                              </button>
                            </td>
                            <td className="px-4 py-3 text-right">
                              <button type="button" onClick={() => requestReview(job)} className="text-xs font-semibold text-ember-600 hover:underline">Review</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {tab === 'leads' && (
                <div className="space-y-2">
                  <h3 className="text-lg font-bold text-slate-900">Leads</h3>
                  <p className="text-sm text-slate-500">Convert a lead to create a job.</p>
                  {leads.map((lead) => (
                    <div key={lead.id} className="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-slate-100 bg-white p-3.5">
                      <div>
                        <p className="text-sm font-semibold text-slate-900">{lead.name}</p>
                        <p className="text-xs text-slate-500">{lead.service} · {lead.email}</p>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className={`rounded-full px-2.5 py-1 text-[11px] font-medium ${demoStatusTone(lead.status)}`}>{lead.status}</span>
                        {lead.status !== 'Won' && (
                          <button type="button" onClick={() => convertLead(lead)} className="rounded-md bg-slate-900 px-3 py-1.5 text-xs font-medium text-white">Convert</button>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {tab === 'customers' && (
                <div className="space-y-2">
                  <h3 className="text-lg font-bold text-slate-900">Customers</h3>
                  {customers.map((customer) => (
                    <button
                      key={customer.id}
                      type="button"
                      onClick={() => { setTab('jobs'); ping(`Showing jobs related to ${customer.name}`); }}
                      className="flex w-full items-center justify-between rounded-xl border border-slate-100 bg-white p-3.5 text-left hover:border-slate-300"
                    >
                      <div>
                        <p className="text-sm font-semibold text-slate-900">{customer.name}</p>
                        <p className="text-xs text-slate-500">{customer.phone}</p>
                      </div>
                      <span className="text-xs font-medium text-slate-500">{customer.jobs} jobs</span>
                    </button>
                  ))}
                </div>
              )}

              {tab === 'reviews' && (
                <div className="space-y-2">
                  <h3 className="text-lg font-bold text-slate-900">Reviews</h3>
                  {reviews.map((review) => (
                    <div key={review.id} className="rounded-xl border border-slate-100 bg-white p-3.5">
                      <div className="flex items-center justify-between">
                        <p className="text-sm font-semibold text-slate-900">{review.name}</p>
                        <span className="text-xs font-semibold text-ember-600">{'★'.repeat(review.stars)}</span>
                      </div>
                      <p className="mt-1 text-sm text-slate-600">{review.text}</p>
                    </div>
                  ))}
                </div>
              )}

              {tab === 'automations' && (
                <div className="space-y-2">
                  <h3 className="text-lg font-bold text-slate-900">Automations</h3>
                  <p className="text-sm text-slate-500">Toggle these on or off — demo only.</p>
                  {automations.map((item) => (
                    <button
                      key={item.id}
                      type="button"
                      onClick={() => {
                        setAutomations((prev) => prev.map((row) => row.id === item.id ? { ...row, active: !row.active } : row));
                        ping(`${item.name} ${item.active ? 'turned off' : 'turned on'}`);
                      }}
                      className="flex w-full items-center justify-between rounded-xl border border-slate-100 bg-white p-3.5 text-left"
                    >
                      <span className="text-sm font-medium text-slate-900">{item.name}</span>
                      <span className={`rounded-full px-2.5 py-1 text-[11px] font-semibold ${item.active ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-500'}`}>
                        {item.active ? 'ON' : 'OFF'}
                      </span>
                    </button>
                  ))}
                </div>
              )}

              {tab === 'settings' && (
                <form
                  onSubmit={(e) => { e.preventDefault(); ping('Demo settings saved locally.'); }}
                  className="space-y-3"
                >
                  <h3 className="text-lg font-bold text-slate-900">Settings</h3>
                  <label className="block text-xs font-medium text-slate-500">Company
                    <input value={settings.company} onChange={(e) => setSettings({ ...settings, company: e.target.value })} className="mt-1 h-10 w-full rounded-md border border-slate-300 px-3 text-sm text-slate-900" />
                  </label>
                  <label className="block text-xs font-medium text-slate-500">Phone
                    <input value={settings.phone} onChange={(e) => setSettings({ ...settings, phone: e.target.value })} className="mt-1 h-10 w-full rounded-md border border-slate-300 px-3 text-sm text-slate-900" />
                  </label>
                  <label className="block text-xs font-medium text-slate-500">City
                    <input value={settings.city} onChange={(e) => setSettings({ ...settings, city: e.target.value })} className="mt-1 h-10 w-full rounded-md border border-slate-300 px-3 text-sm text-slate-900" />
                  </label>
                  <button type="submit" className="h-10 rounded-md bg-ember-500 px-4 text-sm font-semibold text-white">Save demo settings</button>
                </form>
              )}
            </div>
          </div>
        </div>
      );

      if (variant === 'wide') {
        return (
          <div className="flex h-[420px] overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl">
            {dashboardBody}
          </div>
        );
      }

      return (
        <div className="relative mx-auto w-full max-w-[520px] lg:ml-auto lg:mr-0 lg:max-w-none">
          <div className="pointer-events-none absolute -inset-3 -z-10 rounded-[1.75rem] bg-gradient-to-tr from-ember-100/60 via-slate-100/40 to-transparent blur-2xl"></div>
          <div className="flex h-[360px] flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl shadow-slate-900/10 ring-1 ring-slate-900/5 sm:h-[384px] lg:h-[400px]">
            <div className="flex shrink-0 items-center gap-1.5 border-b border-slate-100 bg-slate-50/80 px-3 py-2">
              <span className="h-2.5 w-2.5 rounded-full bg-slate-300"></span>
              <span className="h-2.5 w-2.5 rounded-full bg-slate-300"></span>
              <span className="h-2.5 w-2.5 rounded-full bg-slate-300"></span>
              <span className="ml-2 truncate text-[11px] font-medium text-slate-400">app.briksystems.io</span>
              <span className="ml-auto hidden text-[10px] font-medium text-slate-400 sm:inline">Try clicking around</span>
            </div>
            {dashboardBody}
          </div>
        </div>
      );
    }

    function ContactInquiryForm({ onSubmitInquiry }) {
      const [submitting, setSubmitting] = useState(false);
      const [sent, setSent] = useState(false);
      const inputClass = 'flex h-10 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ember-500';

      if (sent) {
        return (
          <div className="rounded-2xl border border-emerald-200 bg-emerald-50 p-8 text-center">
            <Icon name="circle-check" className="mx-auto h-10 w-10 text-emerald-600" />
            <h3 className="mt-4 text-xl font-bold text-slate-900">Inquiry sent</h3>
            <p className="mt-2 text-sm text-slate-600">We received your details and will follow up by email shortly.</p>
            <button type="button" onClick={() => setSent(false)} className="mt-6 text-sm font-semibold text-ember-600 hover:underline">Send another</button>
          </div>
        );
      }

      return (
        <form
          onSubmit={async (e) => {
            e.preventDefault();
            const f = new FormData(e.target);
            setSubmitting(true);
            const ok = await onSubmitInquiry({
              first_name: f.get('first_name'),
              last_name: f.get('last_name'),
              email: f.get('email'),
              phone: f.get('phone'),
              business: f.get('business'),
              city: f.get('city'),
              website: f.get('website'),
              service: f.get('type') || 'Custom System',
              source: f.get('hear') || 'Website Contact Form',
              notes: [
                f.get('message'),
                f.get('business') ? `Business: ${f.get('business')}` : '',
                f.get('city') ? `City: ${f.get('city')}` : '',
                f.get('website') ? `Website: ${f.get('website')}` : '',
                f.get('hear') ? `Heard about us: ${f.get('hear')}` : '',
              ].filter(Boolean).join('\n'),
            });
            setSubmitting(false);
            if (ok) {
              e.target.reset();
              setSent(true);
            }
          }}
          className="space-y-5"
        >
          <div className="grid gap-5 sm:grid-cols-2">
            <div className="space-y-2">
              <label className="text-sm font-medium leading-none" htmlFor="first_name">First name *</label>

    // =========================================================================

    const INITIAL_PORTAL_DATA = {

    function loadStore() {
      try {
        const stored = localStorage.getItem('brik_systems_data_v3');
        if (stored) return JSON.parse(stored);
      } catch (e) {}
      localStorage.setItem('brik_systems_data_v3', JSON.stringify(INITIAL_PORTAL_DATA));
      return INITIAL_PORTAL_DATA;
    }

    function saveStore(data) {
      localStorage.setItem('brik_systems_data_v3', JSON.stringify(data));
    }

    // =========================================================================
    // Main Application Component
    // =========================================================================
    function App() {
      const [route, setRoute] = useState(() => window.location.hash || '#/');
      const [data, setData] = useState(loadStore);
      const [modal, setModal] = useState({ type: null, data: null });
      const [toast, setToast] = useState(null);

      // Auth & Multi-Tenant State
      const [user, setUser] = useState(null);
      const [profile, setProfile] = useState(null);
      const [organization, setOrganization] = useState(null);
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [authLoading, setAuthLoading] = useState(true);

      // Real Supabase Leads State
      const [leads, setLeads] = useState([]);
      const [leadsLoading, setLeadsLoading] = useState(false);
      const [leadsError, setLeadsError] = useState('');
      const [leadSearchTerm, setLeadSearchTerm] = useState('');
      const [leadStatusFilter, setLeadStatusFilter] = useState('All');
      const [leadSortBy, setLeadSortBy] = useState('newest');
      const [activeLead, setActiveLead] = useState(null);

      // Login form inputs
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');
      const [isLoggingIn, setIsLoggingIn] = useState(false);

      // Supabase connection state
      const [supabaseConfig, setSupabaseConfig] = useState(getSupabaseConfig);

      const authRef = useRef({ isAuthenticated: false, authLoading: true });
      authRef.current = { isAuthenticated, authLoading };

      // -----------------------------------------------------------------------
      // Fetch Real Leads from Supabase
      // -----------------------------------------------------------------------
      const fetchLeads = async () => {
        if (!supabaseClient) return;
        setLeadsLoading(true);
        setLeadsError('');
        try {
          const { data: leadsData, error: leadsErr } = await supabaseClient
            .from('leads')
            .select('*')
            .order('created_at', { ascending: false });

          if (leadsErr) {
            console.warn('Leads fetch error:', leadsErr);
            setLeadsError(leadsErr.message || 'Failed to load leads from database.');
          } else {
            setLeads(leadsData || []);
          }
        } catch (err) {
          console.error('Leads fetch exception:', err);
          setLeadsError(err.message || 'An unexpected error occurred loading leads.');
        } finally {
          setLeadsLoading(false);
        }
      };

      // -----------------------------------------------------------------------
      // Fetch User Profile and Organization from Supabase
      // -----------------------------------------------------------------------
      const loadUserProfile = async (authUser) => {
        if (!supabaseClient || !authUser) return;
        try {
          const { data: profData, error: profErr } = await supabaseClient
            .from('profiles')
            .select('*, organization:organizations(*)')
            .eq('id', authUser.id)
            .single();

          if (profData && !profErr) {
            setProfile(profData);
            if (profData.organization) {
              setOrganization(profData.organization);
            }
          } else {
            const fallbackProfile = {
              id: authUser.id,
              full_name: authUser.user_metadata?.full_name || authUser.email?.split('@')[0] || 'Client',
              email: authUser.email,
              role: 'CLIENT',
            };
            setProfile(fallbackProfile);
            setOrganization({ name: 'Northside Plumbing & Heating', business_type: 'Plumbing & Heating' });
          }
          // Load real database leads after profile identification
          await fetchLeads();
        } catch (err) {
          console.warn('Profile load exception:', err);
          await fetchLeads();
        }
      };

      // -----------------------------------------------------------------------
      // Initialize Supabase Auth & Session Listener
      // -----------------------------------------------------------------------
      useEffect(() => {
        let authSubscription = null;

        const checkSession = async () => {
          setAuthLoading(true);
          try {
            if (supabaseClient) {
              const { data: sessionData, error: sessionErr } = await supabaseClient.auth.getSession();
              if (sessionData?.session?.user && !sessionErr) {
                const currentUser = sessionData.session.user;
                authRef.current.isAuthenticated = true;
                authRef.current.authLoading = false;
                setUser(currentUser);
                setIsAuthenticated(true);
                await loadUserProfile(currentUser);
              } else {
                authRef.current.isAuthenticated = false;
                setUser(null);
                setProfile(null);
                setOrganization(null);
                setIsAuthenticated(false);
                setLeads([]);
              }

              const { data: listener } = supabaseClient.auth.onAuthStateChange(async (event, session) => {
                if (session?.user) {
                  authRef.current.isAuthenticated = true;
                  authRef.current.authLoading = false;
                  setUser(session.user);
                  setIsAuthenticated(true);
                  await loadUserProfile(session.user);
                } else {
                  authRef.current.isAuthenticated = false;
                  setUser(null);
                  setProfile(null);
                  setOrganization(null);
                  setIsAuthenticated(false);
                  setLeads([]);
                }
              });
              authSubscription = listener?.subscription;
            }
          } catch (e) {
            console.warn('Auth check error:', e);
          } finally {
            authRef.current.authLoading = false;
            setAuthLoading(false);
          }
        };

        checkSession();

        return () => {
          if (authSubscription) authSubscription.unsubscribe();
        };
      }, [supabaseConfig]);

      // -----------------------------------------------------------------------
      // Route Guarding (Protects /#/portal routes without stale closure race)
      // -----------------------------------------------------------------------
      useEffect(() => {
        const handleHashChange = () => {
          const currentHash = window.location.hash || '#/';
          setRoute(currentHash);
          window.scrollTo({ top: 0, behavior: 'smooth' });

          // Only redirect if unauthenticated and finished initial check
          if (currentHash.startsWith('#/portal') && !authRef.current.isAuthenticated && !authRef.current.authLoading) {
            setRoute('#/login');
            window.location.hash = '#/login';
          }
        };

        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      const updateData = (updater) => {
        setData((prev) => {
          const next = typeof updater === 'function' ? updater(prev) : { ...prev, ...updater };
          saveStore(next);
          return next;
        });
      };

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      // -----------------------------------------------------------------------
      // Supabase Authentication: Login Handler (Pure Email & Password)
      // -----------------------------------------------------------------------
      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setLoginError('');
        setIsLoggingIn(true);

        const cleanEmail = loginEmail.toLowerCase().trim();
        const cleanPass = loginPassword.trim();

        try {
          if (!supabaseClient) {
            initClient(supabaseConfig.url || DEFAULT_PROJECT_URL, supabaseConfig.key || DEFAULT_ANON_KEY);
          }

          if (supabaseClient) {
            const { data: authResult, error: authErr } = await supabaseClient.auth.signInWithPassword({
              email: cleanEmail,
              password: cleanPass,
            });

            if (authErr) {
              setLoginError('Invalid email or password. Please check your credentials and try again.');
              setIsLoggingIn(false);
              return;
            }

            if (authResult?.user) {
              authRef.current.isAuthenticated = true;
              authRef.current.authLoading = false;
              setUser(authResult.user);
              setIsAuthenticated(true);
              setRoute('#/portal');
              window.location.hash = '#/portal';
              showToast(`Welcome back, ${authResult.user.email}!`);
              setLoginPassword('');
              await loadUserProfile(authResult.user);
            }
          } else {
            setLoginError('Database connection initializing. Please try again in a moment.');
          }
        } catch (err) {
          setLoginError('Invalid email or password. Please check your credentials and try again.');
        } finally {
          setIsLoggingIn(false);
        }
      };

      // -----------------------------------------------------------------------
      // Supabase Authentication: Logout Handler (Redirects to Homepage #/)
      // -----------------------------------------------------------------------
      const handleLogout = async () => {
        try {
          if (supabaseClient) {
            await supabaseClient.auth.signOut();
          }
        } catch (e) {}

        authRef.current.isAuthenticated = false;
        setUser(null);
        setProfile(null);
        setOrganization(null);
        setIsAuthenticated(false);
        setLeads([]);
        setLoginEmail('');
        setLoginPassword('');
        showToast('Logged out successfully.');
        setRoute('#/');
        window.location.hash = '#/';
      };

      // -----------------------------------------------------------------------
      // REAL SUPABASE LEADS CRUD HANDLERS
      // -----------------------------------------------------------------------
      const handleCreateLead = async (leadInput) => {
        const orgId = profile?.organization_id || organization?.id || '00000000-0000-0000-0000-000000000001';
        const firstName = (leadInput.first_name || '').trim();
        const lastName = (leadInput.last_name || '').trim();
        const fullName = leadInput.name ? leadInput.name.trim() : `${firstName} ${lastName}`.trim() || 'New Inquiry';

        const newLeadPayload = {
          organization_id: orgId,
          first_name: firstName || fullName.split(' ')[0] || '',
          last_name: lastName || fullName.split(' ').slice(1).join(' ') || '',
          name: fullName,
          email: (leadInput.email || '').trim() || null,
          phone: (leadInput.phone || '').trim() || null,
          service_requested: (leadInput.service || leadInput.service_requested || '').trim() || 'General Service',
          source: leadInput.source || 'Manual Entry',
          status: leadInput.status || 'New',
          notes: (leadInput.notes || '').trim() || null,
        };

        const addLocalFallback = () => {
          const fallbackRecord = {
            id: `lead_${Date.now()}`,
            ...newLeadPayload,
            created_at: new Date().toISOString(),
            updated_at: new Date().toISOString(),
          };
          setLeads((prev) => [fallbackRecord, ...prev]);
          if (!leadInput.silent) showToast(`Lead created (${fullName})`);
        };

        if (!supabaseClient) {
          addLocalFallback();
          setModal({ type: null });
          return true;
        }

        try {
          const { data: newRecord, error } = await supabaseClient
            .from('leads')
            .insert([newLeadPayload])
            .select()
            .single();

          if (error) {
            console.error('Supabase create lead error:', error);
            // Fallback for demo local state if RLS blocks without profile
            const fallbackRecord = {
              id: `lead_${Date.now()}`,
              ...newLeadPayload,
              created_at: new Date().toISOString(),
              updated_at: new Date().toISOString(),
            };
            setLeads((prev) => [fallbackRecord, ...prev]);
            if (!leadInput.silent) showToast(`Lead created (${fullName})`);
          } else if (newRecord) {
            setLeads((prev) => [newRecord, ...prev]);
            if (!leadInput.silent) showToast(`Lead "${fullName}" created successfully in Supabase!`);
          }
          setModal({ type: null });
          return true;
        } catch (err) {
          console.error('Exception creating lead:', err);
          showToast(`Error: ${err.message}`);
          return false;
        }
      };

      const handleContactInquiry = async (leadInput) => {
        const firstName = (leadInput.first_name || '').trim();
        const lastName = (leadInput.last_name || '').trim();
        const fullName = `${firstName} ${lastName}`.trim();
        let emailed = false;

        try {
          const emailRes = await fetch('https://formsubmit.co/ajax/ipethankuds@gmail.com', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
            body: JSON.stringify({
              _subject: `New Brik Systems inquiry from ${fullName || 'website'}`,
              _template: 'table',
              _captcha: 'false',
              _replyto: (leadInput.email || '').trim(),
              first_name: firstName,
              last_name: lastName,
              name: fullName,
              email: (leadInput.email || '').trim(),
              phone: (leadInput.phone || '').trim(),
              business: (leadInput.business || '').trim(),
              service_needed: (leadInput.service || '').trim(),
              notes: (leadInput.notes || '').trim(),
            }),
          });
          emailed = emailRes.ok;
        } catch (err) {
          console.warn('Contact email send failed:', err);
        }

        await handleCreateLead({
          ...leadInput,
          name: fullName,
          source: leadInput.source || 'Website Contact Form',
          silent: true,
        });

        if (emailed) {
          showToast('Inquiry sent. We will follow up by email.');
        } else {
          showToast('Inquiry saved. Confirm the first FormSubmit email to ipethankuds@gmail.com so future messages arrive.');
        }
        return true;
      };

      const handleUpdateLead = async (leadId, updates) => {
        if (!supabaseClient || !leadId) return;
        try {
          const { data: updatedRecord, error } = await supabaseClient
            .from('leads')
            .update({
              ...updates,
              updated_at: new Date().toISOString(),
            })
            .eq('id', leadId)
            .select()
            .single();

          if (error) {
            console.warn('Update lead error, updating locally:', error);
            setLeads((prev) => prev.map((l) => (l.id === leadId ? { ...l, ...updates } : l)));
          } else if (updatedRecord) {
            setLeads((prev) => prev.map((l) => (l.id === leadId ? updatedRecord : l)));
            if (activeLead && activeLead.id === leadId) {
              setActiveLead(updatedRecord);
            }
          }
          showToast('Lead updated successfully!');
          if (modal.type === 'edit_lead') setModal({ type: null });
        } catch (err) {
          console.error('Exception updating lead:', err);
          showToast(`Error updating lead: ${err.message}`);
        }
      };

      const handleDeleteLead = async (leadId) => {
        if (!supabaseClient || !leadId) return;
        try {
          const { error } = await supabaseClient
            .from('leads')
            .delete()
            .eq('id', leadId);

          if (error) {
            console.warn('Delete lead error, removing locally:', error);

                      <option value="New">New</option>
                      <option value="Contacted">Contacted</option>
                      <option value="Qualified">Qualified</option>
                      <option value="Booked">Booked</option>
                      <option value="Won">Won</option>
                      <option value="Lost">Lost</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Notes / Description</label>
                    <textarea name="notes" rows="2" placeholder="Details about this inquiry..." className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-ember-500 focus:outline-none resize-none"></textarea>
                  </div>

                  <button type="submit" className="w-full bg-ember-500 hover:bg-ember-600 text-white font-semibold py-2.5 rounded-lg transition shadow">
                    Save to Database
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* View Lead Details Modal */}
          {modal.type === 'view_lead' && activeLead && (
            <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl space-y-4 animate-fade-in-up">
                <div className="flex justify-between items-start">
                  <div>
                    <span className="text-xs font-bold text-ember-600 uppercase tracking-wider">{activeLead.source || 'Lead Entry'}</span>
                    <h3 className="text-xl font-bold text-slate-900">{activeLead.name}</h3>
                  </div>
                  <button onClick={() => setModal({ type: null })} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>

                <div className="p-4 bg-slate-50 rounded-xl space-y-2 text-sm border border-slate-100">
                  <div className="flex justify-between items-center">
                    <span className="text-xs font-bold text-slate-500 uppercase">Status</span>
                    <select
                      value={activeLead.status || 'New'}
                      onChange={(e) => handleUpdateLead(activeLead.id, { status: e.target.value })}
                      className="text-xs font-bold px-2.5 py-1 rounded-full border bg-white cursor-pointer"
                    >
                      <option value="New">New</option>
                      <option value="Contacted">Contacted</option>
                      <option value="Qualified">Qualified</option>
                      <option value="Booked">Booked</option>
                      <option value="Won">Won</option>
                      <option value="Lost">Lost</option>
                    </select>
                  </div>

                  <div className="flex justify-between">
                    <span className="text-xs text-slate-500">Service:</span>
                    <span className="font-semibold text-slate-800">{activeLead.service_requested || 'General'}</span>
                  </div>

                  {activeLead.phone && (
                    <div className="flex justify-between">
                      <span className="text-xs text-slate-500">Phone:</span>
                      <a href={`tel:${activeLead.phone}`} className="font-mono text-ember-600 font-semibold">{activeLead.phone}</a>
                    </div>
                  )}

                  {activeLead.email && (
                    <div className="flex justify-between">
                      <span className="text-xs text-slate-500">Email:</span>
                      <a href={`mailto:${activeLead.email}`} className="text-ember-600 font-semibold">{activeLead.email}</a>
                    </div>
                  )}

                  <div className="flex justify-between text-xs text-slate-400 pt-1 border-t border-slate-200">
                    <span>Created: {activeLead.created_at ? new Date(activeLead.created_at).toLocaleString() : 'Recent'}</span>
                  </div>
                </div>

                {activeLead.notes && (
                  <div className="space-y-1">
                    <span className="text-xs font-bold text-slate-700 uppercase">Notes</span>
                    <p className="text-xs text-slate-600 bg-slate-50 p-3 rounded-lg border border-slate-100">{activeLead.notes}</p>
                  </div>
                )}

                <div className="flex gap-2 pt-2">
                  <button
                    onClick={() => setModal({ type: 'edit_lead' })}
                    className="flex-1 bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs py-2.5 rounded-lg transition"
                  >
                    Edit Lead
                  </button>
                  <button
                    onClick={() => setModal({ type: 'delete_lead' })}
                    className="px-3 border border-red-200 text-red-600 hover:bg-red-50 font-semibold text-xs py-2.5 rounded-lg transition"
                  >
                    Delete
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Edit Lead Modal */}
          {modal.type === 'edit_lead' && activeLead && (
            <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl space-y-4 animate-fade-in-up">
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-bold text-slate-900">Edit Lead</h3>
                  <button onClick={() => setModal({ type: null })} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const form = new FormData(e.target);
                    const nameVal = form.get('name') || '';
                    handleUpdateLead(activeLead.id, {
                      name: nameVal,
                      first_name: nameVal.split(' ')[0] || '',
                      last_name: nameVal.split(' ').slice(1).join(' ') || '',
                      email: form.get('email'),
                      phone: form.get('phone'),
                      service_requested: form.get('service_requested'),
                      source: form.get('source'),
                      status: form.get('status'),
                      notes: form.get('notes'),
                    });
                  }}
                  className="space-y-4 text-sm"
                >
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Full Name *</label>
                    <input name="name" required defaultValue={activeLead.name} className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-ember-500 focus:outline-none" />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Phone Number</label>
                      <input name="phone" defaultValue={activeLead.phone || ''} className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-ember-500 focus:outline-none" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
                      <input name="email" type="email" defaultValue={activeLead.email || ''} className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-ember-500 focus:outline-none" />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Requested Service</label>
                      <input name="service_requested" defaultValue={activeLead.service_requested || ''} className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-ember-500 focus:outline-none" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Status</label>
                      <select name="status" defaultValue={activeLead.status || 'New'} className="w-full px-3 py-2 border rounded-lg bg-white focus:ring-2 focus:ring-ember-500 focus:outline-none font-semibold">
                        <option value="New">New</option>
                        <option value="Contacted">Contacted</option>
                        <option value="Qualified">Qualified</option>
                        <option value="Booked">Booked</option>
                        <option value="Won">Won</option>
                        <option value="Lost">Lost</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Source</label>
                    <select name="source" defaultValue={activeLead.source || 'Manual Entry'} className="w-full px-3 py-2 border rounded-lg bg-white focus:ring-2 focus:ring-ember-500 focus:outline-none">
                      <option value="Manual Entry">Manual Entry</option>
                      <option value="Website Form">Website Form</option>
                      <option value="Phone Call">Phone Call</option>
                      <option value="Referral">Referral</option>
                      <option value="Google Search">Google Search</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Notes</label>
                    <textarea name="notes" rows="2" defaultValue={activeLead.notes || ''} className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-ember-500 focus:outline-none resize-none"></textarea>
                  </div>

                  <button type="submit" className="w-full bg-ember-500 hover:bg-ember-600 text-white font-semibold py-2.5 rounded-lg transition shadow">
                    Save Changes
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Delete Lead Confirmation Modal */}
          {modal.type === 'delete_lead' && activeLead && (
            <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl space-y-4 animate-fade-in-up text-center">
                <div className="w-12 h-12 rounded-full bg-red-50 text-red-600 flex items-center justify-center mx-auto">
                  <Icon name="trash-2" className="w-6 h-6" />
                </div>
                <div>
                  <h3 className="text-lg font-bold text-slate-900">Delete Lead?</h3>
                  <p className="text-xs text-slate-500 mt-1">Are you sure you want to delete <span className="font-bold text-slate-700">{activeLead.name}</span>? This action cannot be undone.</p>
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={() => setModal({ type: null })}
                    className="flex-1 border border-slate-300 text-slate-700 font-semibold text-xs py-2.5 rounded-lg hover:bg-slate-50 transition"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => handleDeleteLead(activeLead.id)}
                    className="flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold text-xs py-2.5 rounded-lg transition"
                  >
                    Delete
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* View Portfolio Project Modal */}
          {modal.type === 'view_project' && modal.data && (
            <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-lg w-full shadow-2xl space-y-4 animate-fade-in-up">
                <div className="flex justify-between items-center">
                  <div>
                    <span className="text-xs font-semibold text-ember-600 uppercase">{modal.data.type}</span>
                    <h3 className="text-xl font-bold text-slate-900">{modal.data.name}</h3>
                  </div>
                  <button onClick={() => setModal({ type: null })} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <div className="h-48 overflow-hidden rounded-xl">
                  <WorkCardArt kind={modal.data.art} />
                </div>
                <p className="text-sm text-slate-600">{modal.data.desc}</p>
                <button
                  onClick={() => {
                    setModal({ type: null });
                    window.location.hash = '#/contact';
                  }}
                  className="w-full bg-ember-500 text-white font-bold py-2.5 rounded-xl text-sm hover:bg-ember-600 transition shadow"
                >
                  Build a Similar System for My Business
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render the React Application
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
